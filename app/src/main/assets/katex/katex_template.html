<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="file:///android_asset/katex/katex.min.css">
    <script src="file:///android_asset/katex/katex.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: transparent;
            color: #E2E2E6;
            font-size: 15px;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 10px;
            white-space: nowrap;
        }
        .katex-display {
            margin: 0 !important;
            padding: 0 !important;
            text-align: left !important;
        }
        .katex {
            font-size: 1.15em;
            color: #E2E2E6;
        }
        ::-webkit-scrollbar {
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #43474E;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="math-target"></div>
    <script>
        function renderLatex(rawLatex) {
            try {
                katex.render(rawLatex, document.getElementById('math-target'), {
                    displayMode: true,
                    throwOnError: false,
                    errorColor: '#A8C7FA'
                });
            } catch (e) {
                document.getElementById('math-target').innerText = rawLatex;
            }
        }
    </script>
</body>
</html>
